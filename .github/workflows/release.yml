# A merged PR from dev/vX.Y.Z (or a tag v* pushed by hand) → tests, then the
# image on GHCR and the binary on the release. On a merge the tag vX.Y.Z is
# made on the merge commit and the release notes are the PR's text.
# The TNAS only pulls ghcr.io/mordillosan/failover-agent; nothing is built there.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch: # a manual run publishes the image tagged with the branch, no release

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/mordillosan/failover-agent

jobs:
  release:
    # a PR closed without merging, or from another branch, publishes nothing
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'dev/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Versão
        id: v
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            v=${HEAD_REF#dev/}
            if [[ ! $v =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::notice::$HEAD_REF não é dev/vX.Y.Z: sem release"
              echo "skip=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            # a tag already on another commit is an error; on this one, a re-run of a release that failed
            if sha=$(git ls-remote --tags origin "refs/tags/$v" | cut -f1) && [[ -n $sha && $sha != "$(git rev-parse HEAD)" ]]; then
              echo "::error::a tag $v já existe noutro commit"
              exit 1
            fi
          else
            v=$GITHUB_REF_NAME
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        if: steps.v.outputs.skip != 'true'
        with:
          go-version-file: go.mod

      - name: gofmt e go vet
        if: steps.v.outputs.skip != 'true'
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: steps.v.outputs.skip != 'true'
        with:
          version: "latest"
          install-mode: goinstall

      - name: Testes
        if: steps.v.outputs.skip != 'true'
        run: go test -race ./...

      - name: Imagem
        if: steps.v.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          tags=(-t "$IMAGE:$VERSION")
          if [[ $GITHUB_REF == refs/tags/* || $GITHUB_EVENT_NAME == pull_request ]]; then tags+=(-t "$IMAGE:latest"); fi
          docker build --build-arg "VERSION=$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            "${tags[@]}" -f deploy/Dockerfile .
          docker push --all-tags "$IMAGE"

      - name: Binário
        if: steps.v.outputs.skip != 'true' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request')
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          VERSION: ${{ steps.v.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o failover-agent .
          sha256sum failover-agent > failover-agent.sha256
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            # the tag only now, after the tests and the image: a failed release leaves none behind
            if ! git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
              git tag "$VERSION"
              git push origin "$VERSION" # with the workflow's token: it does not start this workflow again
            fi
            printf '%s\n' "$PR_BODY" > notes.md
            gh release create "$VERSION" failover-agent failover-agent.sha256 --title "$VERSION" --notes-file notes.md
          else
            gh release create "$VERSION" failover-agent failover-agent.sha256 --generate-notes
          fi
